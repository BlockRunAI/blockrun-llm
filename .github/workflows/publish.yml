name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1.8.1 shipped with VERSION and __init__.py still reading 1.8.0. The
      # guard test caught it, but only on the push-triggered CI run, after the
      # release had been cut and published. PyPI does not allow overwriting a
      # published file, so that artifact is permanently wrong. Gate the publish
      # on the same suite instead of discovering the failure afterward.
      # Matches the 3.11 CI job's extras so the gate covers the Solana paths
      # too; without the extra those tests importorskip and pass silently.
      - name: Install package and test deps
        run: pip install -e ".[dev,solana]" build

      - name: Verify the release is publishable
        run: pytest tests/unit -q

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
