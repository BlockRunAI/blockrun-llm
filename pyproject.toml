[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blockrun-llm"
version = "1.15.0"
description = "BlockRun SDK - Pay-per-request AI (LLM, Image, Video, Music, Voice) via x402 on Base and Solana"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "BlockRun", email = "hello@blockrun.ai" }
]
keywords = ["llm", "ai", "x402", "base", "usdc", "micropayments", "openai", "claude", "gemini", "nvidia", "zai", "free-models", "image-generation", "dall-e"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "eth-account>=0.11.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "qrcode[pil]>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black==24.10.0",  # Pin version for consistent formatting
    "mypy>=1.0.0",
    "ruff==0.16.0",   # Pin version: an unpinned linter breaks CI with no code change
]
anthropic = [
    # Anthropic 1.x switched to httpx2; the x402 transport uses httpx.
    # Keep the supported major until both payment modes are migrated together.
    "anthropic>=0.40.0,<1",
]
solana = [
    "x402[svm]>=2.0.0",
    # solana 0.40.0 (2026-06-27) removed solana.rpc.api, which x402's SVM
    # signer imports — fresh installs get _HAS_X402=False. Lift when x402
    # supports the new layout.
    "solana>=0.36,<0.40",
]

[project.urls]
Homepage = "https://blockrun.ai"
Documentation = "https://github.com/BlockRunAI/awesome-blockrun/tree/main/docs"
Repository = "https://github.com/BlockRunAI/blockrun-llm"

[tool.hatch.build.targets.wheel]
packages = ["blockrun_llm"]

[tool.hatch.build.targets.sdist]
exclude = [
  "sweep-*.json",
  "sweep-*.log",
  ".claude/",
  ".ruff_cache/",
  "*.png",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Deferred, NOT blessed. Each of these is a behaviour change in a payments SDK
# and belongs in its own reviewable PR, not folded into a typing sweep:
#
#   BLE001  157 blind `except Exception` — several are deliberate best-effort
#           paths (telemetry, cleanup) where raising would be worse than
#           swallowing. Which ones are deliberate has to be read case by case.
#   S110/   54 try/except/pass and try/except/continue — same question.
#   S112
#   TRY004  8 raising something other than TypeError on a type check.
#   DTZ005/ 4 naive datetime.now()/fromtimestamp() in cache.py, tx_log.py and
#   DTZ006  wallet.py. Worth fixing — a transaction log without timezone is
#           genuinely ambiguous — but it changes recorded values, so it needs
#           its own change and its own migration thought.
#   RUF012  2 mutable class defaults, both in examples/ and tests/.
ignore = ["BLE001", "S110", "S112", "TRY004", "DTZ005", "DTZ006", "RUF012"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.ruff.lint.per-file-ignores]
# pydantic EVALUATES annotations at runtime to build each model. Under
# `from __future__ import annotations` they are strings, and on Python 3.9
# evaluating "str | None" is a TypeError — PEP 604 does not exist there.
#
# Parsing is not the constraint; evaluation is. compileall passes on 3.9 and
# the import still fails, which is exactly how this got shipped to CI once.
#
# So this file keeps typing.Optional/List and no future import.
"blockrun_llm/types.py" = ["FA100", "UP006", "UP007", "UP035", "UP045"]
